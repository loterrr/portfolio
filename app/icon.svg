<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <!-- Rounded squircle badge background -->
  <rect width="32" height="32" rx="7" fill="#0d0e12" />
  <rect x="0.5" y="0.5" width="31" height="31" rx="6.5" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" />

  <!-- Code bracket: left < -->
  <path d="M 11.5 11 L 6.5 16 L 11.5 21" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Distinctive 2D custom "L" monogram inside the brackets -->
  <path d="M 15 10 L 15 22 L 21 22" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code bracket: right > -->
  <path d="M 20.5 11 L 25.5 16 L 20.5 21" stroke="#a1a1aa" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
</svg>
